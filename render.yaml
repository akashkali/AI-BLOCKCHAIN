services:
  - type: web
    name: iot-security-backend
    env: python
    pythonVersion: 3.11.9
    buildCommand: cd flask_app && pip install -r requirements.txt
    startCommand: cd flask_app && gunicorn app:app --threads 4 --bind 0.0.0.0:$PORT
    rootDir: flask_app
    envVars:
      - key: MONGO_URI
        sync: false
      - key: API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: WALLET_ADDRESS
        sync: false
      - key: CONTRACT_ADDRESS
        sync: false
      - key: PORT
        value: 10000

